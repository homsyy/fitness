<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1920" media="(prefers-color-scheme: dark)">
<title>Tideline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f4f3; --surface: #ffffff; --sunk: #e8edec; --ink: #0f2530; --ink2: #44575f; --muted: #6d7d84; --line: #d9e0e1;
  --brand: #0e5a7a; --brand-ink: #ffffff; --brand-soft: #deedf3; --gold: #f2b21b; --gold-ink: #6b4a00; --gold-soft: #fdf3d3;
  --good: #1c7550; --warn: #8a5a00; --danger: #b3372f;
  --s1: #2a78d6; --s2: #eb6834;
  --display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif; --body: 'Hanken Grotesk', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1920; --surface: #13252f; --sunk: #0f1f28; --ink: #e9f0f2; --ink2: #b3c2c8; --muted: #8497a0; --line: #25404d;
    --brand: #6cc0de; --brand-ink: #05202b; --brand-soft: #17394a; --gold: #f2b21b; --gold-ink: #f7cf6a; --gold-soft: #33290d;
    --good: #5fc79a; --warn: #e3b25a; --danger: #f08a80;
    --s1: #3987e5; --s2: #d95926;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.5 var(--body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
h1 { font: 700 clamp(1.75rem, 5vw, 2.25rem)/1.1 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
h2 { font: 650 1.125rem/1.25 var(--display); letter-spacing: -0.01em; }
h3 { font: 650 1.125rem/1.25 var(--display); }
h4 { font: 600 0.9375rem/1.3 var(--body); margin-bottom: 4px; }
ul, ol { padding: 0; list-style: none; }
a { color: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.meta { color: var(--muted); font-size: 0.875rem; }
.note, .fine, .sec-note { color: var(--ink2); font-size: 0.875rem; }
.brand { font: 700 1.125rem var(--display); letter-spacing: -0.01em; color: var(--brand); }
.empty { padding: 28px 20px; border: 1.5px dashed var(--line); border-radius: 14px; color: var(--ink2); text-align: center; }

/* Buttons and choices */
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 600; text-decoration: none; color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink2); }
.btn.ghost:hover { background: var(--sunk); }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 0.875rem; }
.btn.big { min-height: 52px; padding: 0 22px; font-size: 1.0625rem; }
.btn.block { width: 100%; margin: 4px 0 16px; }
.link { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 600; cursor: pointer; text-align: left; }
.icon-btn { width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--ink2); font-size: 1.125rem; cursor: pointer; }
.icon-btn:hover:not(:disabled) { background: var(--sunk); }
.icon-btn:disabled { opacity: 0.3; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.actions.spread { justify-content: space-between; }
.choices { display: grid; gap: 8px; }
.choices.two { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.choices.inline { display: flex; flex-wrap: wrap; }
.choice { display: flex; flex-direction: column; gap: 2px; min-height: 44px; justify-content: center; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); text-align: left; cursor: pointer; font-weight: 600; }
.choice small { font-weight: 400; color: var(--muted); font-size: 0.8125rem; }
.choice[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 36px; padding: 0 13px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 0.875rem; font-weight: 600; cursor: pointer; color: var(--ink2); }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tag { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--sunk); color: var(--ink2); font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
.tag.brand { background: var(--brand-soft); color: var(--brand); }

/* Forms */
.field { display: block; margin-top: 14px; }
.field > span, .mini > span { display: block; margin-bottom: 5px; font-size: 0.8125rem; font-weight: 600; color: var(--ink2); }
input[type="text"], input[type="number"], input[type="date"], select, textarea { width: 100%; min-height: 44px; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 1rem; }
textarea { resize: vertical; line-height: 1.4; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.8; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.row select { width: auto; max-width: 100%; }
.add-row { display: flex; gap: 8px; margin-top: 12px; }
.add-row > :first-child { flex: 1; min-width: 0; }

/* Sign-in and onboarding */
.auth { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.auth-in { max-width: 34rem; }
.auth h1 { font-size: clamp(2.25rem, 9vw, 3.5rem); margin: 18px 0 16px; }
.lede { color: var(--ink2); font-size: 1.0625rem; max-width: 36rem; margin-top: 8px; }
.auth-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 28px 0 14px; }
.ob { max-width: 40rem; margin: 0 auto; padding: 20px 16px 120px; }
.ob-head { margin-bottom: 28px; }
.steps { display: flex; gap: 6px; margin-top: 14px; }
.steps li { flex: 1; padding-top: 8px; border-top: 4px solid var(--line); font-size: 0.75rem; color: var(--muted); font-weight: 600; }
.steps li.done { border-color: var(--brand); }
.steps li.now { border-color: var(--ink); color: var(--ink); }
.steps li span { display: none; }
.steps li.now span { display: inline; }
.ob-body h1 { margin-bottom: 6px; }
.ob-body .lede { margin-bottom: 18px; }
.ob-body > .choices { margin-top: 18px; }
.ob-foot { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; gap: 12px; padding: 12px max(16px, calc(50vw - 20rem + 16px)) calc(12px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
.ob-foot .btn.primary { min-width: 9rem; }

/* Shell */
.shell { min-height: 100vh; }
.main { max-width: 44rem; margin: 0 auto; padding: 20px 16px 104px; }
.main.wide { max-width: 68rem; }
.nav { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.nav .brand { display: none; }
.nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; color: var(--muted); font-size: 0.6875rem; font-weight: 600; text-decoration: none; }
.nav a.on { color: var(--brand); }
.ico { width: 24px; height: 24px; }
@media (min-width: 900px) {
  .nav { top: 0; right: auto; width: 13.5rem; flex-direction: column; gap: 2px; padding: 24px 12px; border-top: 0; border-right: 1px solid var(--line); }
  .nav .brand { display: block; padding: 0 12px 20px; font-size: 1.375rem; }
  .nav a { flex: none; flex-direction: row; gap: 12px; padding: 10px 12px; border-radius: 10px; font-size: 0.9375rem; }
  .nav a.on { background: var(--brand-soft); }
  .nav a:hover:not(.on) { background: var(--sunk); }
  .shell { padding-left: 13.5rem; }
  .main { padding: 40px 32px 64px; }
}
.page-head { margin-bottom: 18px; }
.page-head .meta { margin-bottom: 2px; }
.page-head h1 + .meta { margin-top: 6px; }
.back { display: inline-block; margin-bottom: 10px; font-size: 0.875rem; font-weight: 600; text-decoration: none; }
.back::before { content: '‹ '; }
.sec { margin: 26px 0 10px; font-size: 1rem; color: var(--ink2); }
.sec + .sec-note { margin: -6px 0 12px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 12px; }
.card.quiet { background: transparent; }
.card.accent { border-color: var(--brand); background: var(--brand-soft); }
.card.gold { border-color: var(--gold); background: var(--gold-soft); }
.card.best { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.card > h2 + p, .card > h2 + .chips, .card > h2 + .choices { margin-top: 8px; }
.card > .meta + h2 { margin-top: 2px; }
.card > h2 + .chips { margin-top: 12px; }
.card .chips + .plain { margin-top: 12px; }
.prog-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 8px; }
.prog p { color: var(--ink2); }
.caution { margin-top: 8px; font-size: 0.875rem; color: var(--warn) !important; }
.fit { margin-top: 10px; display: grid; gap: 4px; font-size: 0.875rem; }
.fit li { padding-left: 22px; position: relative; color: var(--ink2); }
.fit li::before { position: absolute; left: 0; font-weight: 700; }
.fit .yes::before { content: '✓'; color: var(--good); }
.fit .warn::before { content: '!'; left: 5px; color: var(--warn); }
.fit .warn { color: var(--warn); }
.plain li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.plain li:first-child { border-top: 0; }
.plain .meta { white-space: nowrap; }
.days-preview { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 24px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 0.9375rem; }
.days-preview .plain li { padding: 5px 0; border: 0; }
.quote { color: var(--ink2); font-style: italic; margin-top: 8px; white-space: pre-wrap; }
.card.quiet > .quote { margin: 0; }

/* The week strip */
.week { margin-bottom: 16px; padding: 18px; border-radius: 14px; background: var(--ink); color: var(--bg); }
.week-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 600; opacity: 0.62; }
.wd.on, .wd.today { opacity: 1; }
.wd-bar { width: 100%; height: 72px; display: flex; align-items: flex-end; border-bottom: 2px solid color-mix(in srgb, var(--bg) 28%, transparent); }
.wd-bar i { display: block; width: 100%; border-radius: 6px 6px 0 0; background: var(--gold); }
.wd.today span { padding: 0 7px; border-radius: 999px; background: var(--bg); color: var(--ink); }
.wd.future { opacity: 0.38; }
.week-sum { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.week-sum strong { font: 700 1.25rem var(--display); }
.week .tag { background: color-mix(in srgb, var(--bg) 16%, transparent); color: var(--bg); }

/* Records */
.medal { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 30%, transparent); }
.pr { display: inline-flex; align-items: center; gap: 8px; padding: 2px 10px 2px 7px; border-radius: 999px; background: var(--gold-soft); color: var(--gold-ink); font-size: 0.8125rem; font-weight: 700; white-space: nowrap; }
.pr .medal { width: 8px; height: 8px; box-shadow: none; }
.prs { display: grid; gap: 12px; margin-top: 12px; }
.prs li { display: flex; gap: 12px; align-items: flex-start; }
.prs .medal { margin-top: 6px; }
.pr-label { color: var(--ink2); }
.pr-banner { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 10px 14px; border-radius: 10px; background: var(--gold-soft); color: var(--gold-ink); font-weight: 700; }

/* Program builder */
.day-head { display: flex; gap: 8px; align-items: center; }
.day-name { font: 650 1.125rem var(--display) !important; }
.b-items { margin-top: 12px; display: grid; gap: 10px; }
.b-item { padding: 12px; border-radius: 10px; background: var(--sunk); }
.b-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.b-name { flex: 1 1 6rem; min-width: 0; font-weight: 600; }
.b-tools { display: flex; flex: none; }
.kind { flex: none; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; background: var(--surface); color: var(--ink2); }
.b-fields { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.mini { flex: 0 1 5.5rem; min-width: 4.5rem; }
.mini.wide { flex-basis: 9rem; }
.mini.grow { flex: 1 1 10rem; }
.adders { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; }
.savebar { position: sticky; bottom: 72px; z-index: 5; display: flex; justify-content: flex-end; gap: 8px; padding: 10px; margin-top: 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
@media (min-width: 900px) { .savebar { bottom: 16px; } }

/* Logging */
.session { min-height: 100vh; padding-bottom: 96px; }
.session-head { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg); }
.session-title { flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: center; line-height: 1.25; }
.session-title strong { font-family: var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#elapsed { font-variant-numeric: tabular-nums; }
.progress { position: sticky; top: 56px; z-index: 10; height: 4px; background: var(--line); }
.progress i { display: block; height: 100%; background: var(--brand); transition: width 0.25s; }
.session-body { max-width: 40rem; margin: 0 auto; padding: 16px 12px; }
.entry-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.entry h2 { font-size: 1.25rem; }
.coach { margin: 12px 0; padding: 10px 12px; border-left: 3px solid var(--brand); border-radius: 0 8px 8px 0; background: var(--brand-soft); font-size: 0.875rem; color: var(--ink2); }
.coach.first { border-color: var(--muted); background: var(--sunk); }
.coach .tip-line { margin-top: 4px; color: var(--ink); font-weight: 700; }
.coach .last-note { margin-top: 4px; font-style: italic; }
.sets { display: grid; gap: 6px; }
.set-head, .set { display: grid; grid-template-columns: 28px 1fr 1fr 48px; gap: 8px; align-items: center; }
.sets.timed .set-head, .sets.timed .set { grid-template-columns: 28px 1fr 48px; }
.set-head { font-size: 0.75rem; font-weight: 600; color: var(--muted); }
.set-head span:nth-child(n + 2) { padding-left: 4px; }
.set-n { font: 700 1rem var(--display); color: var(--muted); text-align: center; }
.set input { text-align: center; font: 600 1.125rem var(--display); font-variant-numeric: tabular-nums; min-height: 48px; }
.set.done input { background: var(--sunk); border-color: transparent; }
.set .pr { grid-column: 2 / -1; justify-self: start; margin-bottom: 4px; }
.tick-btn { height: 48px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--muted); font-size: 1.25rem; font-weight: 700; cursor: pointer; }
.tick-btn[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--surface); }
.set-tools { display: flex; gap: 6px; margin-top: 10px; }
.note-field textarea { min-height: 44px; }
.cardio-in { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.cardio-in .mini { flex: 1 1 7rem; }
.cardio-in input { font: 600 1.125rem var(--display); }
.live { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 28px; }
.pace { font: 700 1.125rem var(--display); font-variant-numeric: tabular-nums; }
.rest { position: fixed; z-index: 30; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); overflow: hidden; white-space: nowrap; }
.rest[hidden] { display: none; }
.rest strong { font: 700 1.25rem var(--display); font-variant-numeric: tabular-nums; padding-right: 10px; }
.rest i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--gold); }
.rest .btn { color: var(--bg); }
.rest .btn:hover { background: color-mix(in srgb, var(--bg) 18%, transparent); }

/* History */
.hist { display: grid; gap: 8px; }
.hist a { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: inherit; text-decoration: none; }
.hist a:hover { border-color: var(--muted); }
.hist-date { flex: none; width: 2.5rem; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; color: var(--muted); font-weight: 600; line-height: 1.2; }
.hist-date b { font: 700 1.375rem/1 var(--display); color: var(--ink); }
.hist-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.set-list { margin-top: 8px; counter-reset: s; }
.set-list li { counter-increment: s; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; font-weight: 600; }
.set-list li::before { content: counter(s); width: 1.5rem; color: var(--muted); font-weight: 600; }
.big-line { margin-top: 6px; font: 650 1.25rem var(--display); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* Stats */
.range { margin-bottom: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 10px; margin-bottom: 12px; }
.tile { display: flex; flex-direction: column; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.tiles.inner { margin: 12px 0 4px; }
.tiles.inner .tile { background: var(--sunk); border-color: transparent; }
.tile-l { font-size: 0.8125rem; font-weight: 600; color: var(--ink2); }
.tile-v { font: 700 1.75rem/1.2 var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.tile-v small { font-size: 0.9375rem; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.tile-s { font-size: 0.8125rem; color: var(--muted); }
.stat-grid { display: grid; gap: 12px; }
.stat-grid .card { margin: 0; min-width: 0; }
@media (min-width: 760px) { .stat-grid { grid-template-columns: 1fr 1fr; } .stat-grid .wide { grid-column: 1 / -1; } }
.chart { margin-top: 12px; min-height: 60px; }
.chart.scroll { overflow-x: auto; }
.chart svg { display: block; max-width: none; }
.chart text { font-family: var(--body); }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.direct { fill: var(--ink); font-size: 12px; font-weight: 700; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
.grid { stroke: var(--line); stroke-width: 1; }
.grid.base { stroke: var(--muted); }
.target { stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 4 4; }
.target-label { fill: var(--ink2); font-weight: 600; }
svg .s1 { fill: var(--s1); } svg .s2 { fill: var(--s2); }
svg .s1.dim { fill-opacity: 0.45; }
svg .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg .line.s1 { stroke: var(--s1); } svg .line.s2 { stroke: var(--s2); }
svg .dot { stroke: var(--surface); stroke-width: 2; }
svg .dot.quiet { opacity: 0; }
.hit { fill: transparent; }
.guide { stroke: var(--muted); stroke-width: 1; opacity: 0; }
.pt:hover .guide { opacity: 0.6; }
.pt:hover .dot { opacity: 1; r: 5.5; }
.cell { fill: var(--s1); }
.cell.l0 { fill: var(--sunk); } .cell.l1 { fill-opacity: 0.3; } .cell.l2 { fill-opacity: 0.52; } .cell.l3 { fill-opacity: 0.76; }
.cell.today { stroke: var(--ink); stroke-width: 1.5; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 6px; font-size: 0.8125rem; color: var(--ink2); }
.legend.end { justify-content: flex-end; gap: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Template shorthand */
const S = (name, sets, reps, restSec = 90) => ({ kind: 'strength', name, sets, reps: String(reps), restSec });

/* ---------- Pure helpers: dates, units, program fit, records, stats ---------- */

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = n => String(n).padStart(2, '0');
const toDateStr = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayStr = () => toDateStr(new Date());
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return toDateStr(d); };
const weekStart = s => { const d = parseDate(s); return addDays(s, -((d.getDay() + 6) % 7)); };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const fmtDate = (s, withYear) => { const d = parseDate(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}${withYear ? ' ' + d.getFullYear() : ''}`; };
const relDate = s => {
  const diff = Math.round((parseDate(todayStr()) - parseDate(s)) / 864e5);
  if (diff === 0) return 'today';
  if (diff === 1) return 'yesterday';
  if (diff > 1 && diff < 7) return `${diff} days ago`;
  return fmtDate(s, parseDate(s).getFullYear() !== new Date().getFullYear());
};
const exKey = name => String(name || '').trim().toLowerCase();
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const round = (n, dp = 1) => { const f = 10 ** dp; return Math.round(n * f) / f; };

/* Units. Everything is stored in kg, km and cm; conversion happens at the edges. */
const LB = 2.20462, MI = 0.621371;
let UNITS = 'metric';
const setUnits = u => { UNITS = u === 'imperial' ? 'imperial' : 'metric'; };
const wUnit = () => (UNITS === 'imperial' ? 'lb' : 'kg');
const dUnit = () => (UNITS === 'imperial' ? 'mi' : 'km');
const wOut = kg => (UNITS === 'imperial' ? round(kg * LB, 1) : round(kg, 2));
const wIn = v => (UNITS === 'imperial' ? num(v) / LB : num(v));
const dOut = km => (UNITS === 'imperial' ? round(km * MI, 2) : round(km, 2));
const dIn = v => (UNITS === 'imperial' ? num(v) / MI : num(v));
const fmtW = kg => `${wOut(kg)} ${wUnit()}`;
const fmtD = km => `${dOut(km)} ${dUnit()}`;
const fmtSet = s => (s.kg > 0 ? `${wOut(s.kg)} × ${s.reps}` : `${s.reps} reps`);
const fmtDur = min => {
  min = Math.round(min);
  if (min < 60) return `${min} min`;
  return `${Math.floor(min / 60)} h ${pad2(min % 60)}`;
};
const fmtSec = sec => (sec >= 60 ? `${Math.floor(sec / 60)}:${pad2(Math.round(sec % 60))}` : `${Math.round(sec)} s`);
const paceOf = (min, km) => (km > 0 && min > 0 ? min / km : null); // minutes per km
const fmtPace = p => {
  if (!p) return '';
  const per = UNITS === 'imperial' ? p / MI : p;
  let m = Math.floor(per), s = Math.round((per - m) * 60);
  if (s === 60) { m += 1; s = 0; }
  return `${m}:${pad2(s)} /${dUnit()}`;
};
const fmtBig = n => (n >= 10000 ? `${round(n / 1000, 1)}k` : String(Math.round(n)));

/* Estimated one-rep max (Epley). Above 12 reps the estimate stops being meaningful, so it is capped. */
const e1rm = (kg, reps) => (reps <= 1 ? kg : kg * (1 + Math.min(reps, 12) / 30));

/* ---------- Program fit ---------- */

function equipmentOk(needs, has) {
  const rank = { bodyweight: 0, home: 1, gym: 2 };
  return rank[has || 'gym'] >= rank[needs || 'bodyweight'];
}

function programCautions(program, profile) {
  const mine = new Set(profile.restrictions || []);
  if (!mine.size) return [];
  const byArea = {};
  program.days.forEach(d => d.items.forEach(it => stressOf(it).forEach(area => {
    if (mine.has(area)) (byArea[area] = byArea[area] || new Set()).add(it.name);
  })));
  return Object.entries(byArea).map(([area, names]) => ({
    area, label: RESTRICTIONS.find(r => r.id === area).label, exercises: [...names]
  }));
}

function fitFor(t, profile) {
  let score = 0; const reasons = []; const warnings = [];
  const goal = GOALS.find(g => g.id === profile.goal);
  const gi = t.goals.indexOf(profile.goal);
  if (gi >= 0) { score += gi === 0 ? 50 : 38; if (goal) reasons.push(`Built for your goal: ${goal.label.toLowerCase()}`); }
  if (t.levels.includes(profile.level)) { score += 20; reasons.push('Right for your experience'); }
  else warnings.push(profile.level === 'beginner' ? 'Designed for more experienced lifters' : 'Designed for people newer to training');
  const want = profile.daysPerWeek || 3, diff = Math.abs(t.daysPerWeek - want);
  score += Math.max(-15, 20 - diff * 9);
  if (diff === 0) reasons.push(`${t.daysPerWeek} days a week, as you planned`);
  else warnings.push(`${t.daysPerWeek} days a week (you planned ${want})`);
  if (!equipmentOk(t.equipment, profile.equipment)) {
    score -= 100; warnings.push(t.equipment === 'gym' ? 'Needs a full gym' : 'Needs dumbbells');
  }
  const cautions = programCautions(t, profile);
  score -= cautions.length * 12;
  return { score, reasons, warnings, cautions };
}

function rankedTemplates(profile) {
  return TEMPLATES.map(t => ({ t, fit: fitFor(t, profile) })).sort((a, b) => b.fit.score - a.fit.score);
}

function programFromTemplate(t) {
  return {
    id: uid(), templateId: t.templateId, name: t.name, description: t.description, type: t.type,
    daysPerWeek: t.daysPerWeek, status: 'active', createdAt: new Date().toISOString(),
    days: t.days.map(d => ({ id: uid(), name: d.name, items: d.items.map(it => ({ id: uid(), notes: '', ...it })) }))
  };
}

/* ---------- Records ----------
   Bests are accumulated chronologically. A record only counts when there is earlier history to beat. */

const newBests = () => ({ strength: {}, cardio: {}, timed: {} });

function strengthPRs(b, set) {
  if (!b || !b.sets.length) return [];
  const out = [];
  if (set.kg > 0) {
    if (set.kg > b.maxKg) out.push({ type: 'weight', label: 'Heaviest weight', detail: `${fmtW(set.kg)}, up from ${fmtW(b.maxKg)}` });
    const e = e1rm(set.kg, set.reps);
    if (e > b.bestE1 + 0.01 && !out.length) out.push({ type: 'e1rm', label: 'Strongest set', detail: `${fmtSet(set)} beats ${fmtSet(b.bestSet)}` });
    const atOrAbove = b.sets.filter(s => s.kg >= set.kg - 0.001);
    if (atOrAbove.length && !out.length) {
      const most = Math.max(...atOrAbove.map(s => s.reps));
      if (set.reps > most) out.push({ type: 'reps', label: 'Most reps at this weight', detail: `${set.reps} reps at ${fmtW(set.kg)}, up from ${most}` });
    }
  } else if (b.maxKg === 0 && set.reps > b.maxReps) {
    out.push({ type: 'reps', label: 'Most reps', detail: `${set.reps} reps, up from ${b.maxReps}` });
  }
  return out;
}

function addStrength(bests, name, set) {
  const k = exKey(name);
  const b = bests.strength[k] || (bests.strength[k] = { maxKg: 0, bestE1: 0, bestSet: null, maxReps: 0, sets: [] });
  const e = e1rm(set.kg, set.reps);
  if (set.kg > b.maxKg) b.maxKg = set.kg;
  if (e > b.bestE1 || !b.bestSet) { b.bestE1 = e; b.bestSet = { kg: set.kg, reps: set.reps }; }
  if (set.reps > b.maxReps) b.maxReps = set.reps;
  b.sets.push({ kg: set.kg, reps: set.reps });
}

function cardioPRs(b, entry) {
  if (!b || !b.count) return [];
  const out = [], p = paceOf(entry.minutes, entry.km);
  if (entry.km > 0 && b.maxKm > 0 && entry.km > b.maxKm) out.push({ type: 'distance', label: 'Longest distance', detail: `${fmtD(entry.km)}, up from ${fmtD(b.maxKm)}` });
  if (entry.minutes > b.maxMin) out.push({ type: 'duration', label: 'Longest session', detail: `${fmtDur(entry.minutes)}, up from ${fmtDur(b.maxMin)}` });
  if (p && entry.km >= 1 && b.bestPace && p < b.bestPace - 0.005) out.push({ type: 'pace', label: 'Fastest pace', detail: `${fmtPace(p)}, down from ${fmtPace(b.bestPace)}` });
  return out;
}

function addCardio(bests, entry) {
  const k = entry.activity || 'other';
  const b = bests.cardio[k] || (bests.cardio[k] = { count: 0, maxKm: 0, maxMin: 0, bestPace: null });
  const p = paceOf(entry.minutes, entry.km);
  b.count++;
  if (entry.km > b.maxKm) b.maxKm = entry.km;
  if (entry.minutes > b.maxMin) b.maxMin = entry.minutes;
  if (p && entry.km >= 1 && (!b.bestPace || p < b.bestPace)) b.bestPace = p;
}

const doneSets = e => (e.sets || []).filter(s => setDone(e, s));
const cardioDone = e => e.kind === 'cardio' && e.minutes > 0;

const setDone = (e, s) => s.done !== false && (e.kind === 'timed' ? s.sec > 0 : s.reps > 0);

/* Walks one workout, returning its records and folding it into the running bests. */
function scoreWorkout(bests, w) {
  const prs = [];
  (w.entries || []).forEach((e, entryIndex) => {
    if (e.kind === 'strength') {
      (e.sets || []).forEach((s, setIndex) => {
        if (!setDone(e, s)) return;
        strengthPRs(bests.strength[exKey(e.name)], s).forEach(pr => prs.push({ ...pr, name: e.name, entryIndex, setIndex }));
        addStrength(bests, e.name, s);
      });
    } else if (e.kind === 'cardio') {
      if (!cardioDone(e)) return;
      cardioPRs(bests.cardio[e.activity || 'other'], e).forEach(pr => prs.push({ ...pr, name: e.name || activityOf(e.activity).label, entryIndex }));
      addCardio(bests, e);
    } else if (e.kind === 'timed') {
      const k = exKey(e.name);
      (e.sets || []).forEach((s, setIndex) => {
        if (!setDone(e, s)) return;
        const b = bests.timed[k];
        if (b && s.sec > b.maxSec) prs.push({ type: 'hold', label: 'Longest hold', detail: `${fmtSec(s.sec)}, up from ${fmtSec(b.maxSec)}`, name: e.name, entryIndex, setIndex });
        if (!b) bests.timed[k] = { maxSec: s.sec }; else if (s.sec > b.maxSec) b.maxSec = s.sec;
      });
    }
  });
  return prs;
}

const byDate = (a, b) => (a.date === b.date ? String(a.startedAt || '').localeCompare(String(b.startedAt || '')) : a.date < b.date ? -1 : 1);

/* Records for every workout, in chronological order. Returns Map(workoutId -> prs). */
function allRecords(workouts) {
  const bests = newBests(), map = new Map();
  [...workouts].sort(byDate).forEach(w => map.set(w.id, scoreWorkout(bests, w)));
  return { map, bests };
}

/* Bests as they stood before a given workout (used while logging). */
function bestsBefore(workouts, date, excludeId) {
  const bests = newBests();
  workouts.filter(w => w.id !== excludeId && w.date <= date).sort(byDate).forEach(w => scoreWorkout(bests, w));
  return bests;
}

/* Previous sessions of one exercise, newest first. */
function previousSessions(workouts, entry, date, excludeId) {
  const out = [];
  workouts.filter(w => w.id !== excludeId && w.date <= date).sort(byDate).reverse().forEach(w => {
    (w.entries || []).forEach(e => {
      if (e.kind !== entry.kind) return;
      const same = entry.kind === 'cardio' ? (e.activity || 'other') === (entry.activity || 'other') : exKey(e.name) === exKey(entry.name);
      if (!same) return;
      if (entry.kind === 'cardio' ? cardioDone(e) : doneSets(e).length) out.push({ date: w.date, entry: e });
    });
  });
  return out;
}

const repRange = reps => {
  const m = String(reps || '').match(/(\d+)\s*[-–]\s*(\d+)/);
  if (m) return [+m[1], +m[2]];
  const n = parseInt(reps, 10);
  return n ? [n, n] : null;
};

/* What to tell someone about an exercise before they start it. */
function coachNotes(workouts, entry, date, excludeId) {
  const prev = previousSessions(workouts, entry, date, excludeId);
  if (!prev.length) return { first: true, lines: ['First time logging this. Today sets your baseline.'] };
  const last = prev[0], lines = [], bests = bestsBefore(workouts, date, excludeId);
  let tip = '';
  if (entry.kind === 'strength') {
    const sets = doneSets(last.entry), b = bests.strength[exKey(entry.name)];
    lines.push(`Last time, ${relDate(last.date)}: ${sets.map(fmtSet).join(', ')}`);
    if (b && b.bestSet) lines.push(`Best set so far: ${fmtSet(b.bestSet)}${b.bestSet.kg > 0 ? ` (about ${fmtW(round(b.bestE1, 1))} for one rep)` : ''}`);
    const range = repRange(entry.reps), top = sets.reduce((a, s) => (s.kg > a.kg ? s : a), sets[0]);
    if (range && top.kg > 0 && sets.every(s => s.reps >= range[1])) {
      const step = top.kg >= 40 ? 2.5 : top.kg >= 10 ? 1 : 0.5;
      tip = `You hit ${range[1]} reps on every set. Try ${fmtW(top.kg + step)} today.`;
    } else if (range && top.kg > 0) {
      const low = sets.reduce((a, s) => Math.min(a, s.reps), 99);
      tip = `Stay at ${fmtW(top.kg)} and beat ${low} reps on your weakest set.`;
    } else if (top.kg === 0) tip = `Beat ${Math.max(...sets.map(s => s.reps))} reps on your best set.`;
  } else if (entry.kind === 'cardio') {
    const e = last.entry, b = bests.cardio[entry.activity || 'other'], p = paceOf(e.minutes, e.km);
    lines.push(`Last time, ${relDate(last.date)}: ${fmtDur(e.minutes)}${e.km > 0 ? `, ${fmtD(e.km)}` : ''}${p ? ` at ${fmtPace(p)}` : ''}`);
    if (b) {
      const bits = [`longest ${fmtDur(b.maxMin)}`];
      if (b.maxKm > 0) bits.push(`furthest ${fmtD(b.maxKm)}`);
      if (b.bestPace) bits.push(`fastest ${fmtPace(b.bestPace)}`);
      lines.push(`Your records: ${bits.join(', ')}`);
    }
  } else {
    const sets = doneSets(last.entry), b = bests.timed[exKey(entry.name)];
    lines.push(`Last time, ${relDate(last.date)}: ${sets.map(s => fmtSec(s.sec)).join(', ')}`);
    if (b) lines.push(`Longest hold: ${fmtSec(b.maxSec)}`);
  }
  return { first: false, lines, tip, lastNote: last.entry.notes || '', last: last.entry, count: prev.length };
}

/* ---------- Stats ---------- */

const entryVolume = e => (e.kind === 'strength' ? doneSets(e).reduce((a, s) => a + s.kg * s.reps, 0) : 0);
const workoutVolume = w => (w.entries || []).reduce((a, e) => a + entryVolume(e), 0);
const workoutKm = w => (w.entries || []).reduce((a, e) => a + (cardioDone(e) ? e.km || 0 : 0), 0);
const workoutSets = w => (w.entries || []).reduce((a, e) => a + (e.kind === 'cardio' ? 0 : doneSets(e).length), 0);

/* Minutes split into cardio and everything else. Old imports have no duration, so sets are estimated at 3 minutes each. */
function workoutMinutes(w) {
  const cardio = (w.entries || []).reduce((a, e) => a + (cardioDone(e) ? e.minutes : 0), 0);
  const total = w.durationMin > 0 ? w.durationMin : cardio + workoutSets(w) * 3;
  return { cardio: Math.min(cardio, total), strength: Math.max(0, total - cardio), total: Math.max(total, cardio) };
}

function weeklySeries(workouts, weeks, endDate = todayStr()) {
  const end = weekStart(endDate), rows = [];
  for (let i = weeks - 1; i >= 0; i--) rows.push({ start: addDays(end, -7 * i), count: 0, strength: 0, cardio: 0, volume: 0, km: 0, days: new Set() });
  const idx = new Map(rows.map(r => [r.start, r]));
  workouts.forEach(w => {
    const r = idx.get(weekStart(w.date)); if (!r) return;
    const m = workoutMinutes(w);
    r.count++; r.days.add(w.date); r.strength += m.strength; r.cardio += m.cardio; r.volume += workoutVolume(w); r.km += workoutKm(w);
  });
  return rows;
}

/* Weeks in a row that met the weekly target. The current week only counts once it is met. */
function targetStreak(workouts, target) {
  const rows = weeklySeries(workouts, 104).reverse();
  let n = 0;
  for (let i = 0; i < rows.length; i++) {
    if (rows[i].count >= target) n++;
    else if (i === 0) continue;
    else break;
  }
  return n;
}

function exerciseSeries(workouts, name) {
  const k = exKey(name), pts = [];
  [...workouts].sort(byDate).forEach(w => (w.entries || []).forEach(e => {
    if (e.kind !== 'strength' || exKey(e.name) !== k) return;
    const sets = doneSets(e); if (!sets.length) return;
    const best = sets.reduce((a, s) => (e1rm(s.kg, s.reps) > e1rm(a.kg, a.reps) ? s : a), sets[0]);
    pts.push({ date: w.date, value: best.kg > 0 ? e1rm(best.kg, best.reps) : best.reps, set: best, bodyweight: best.kg === 0 });
  }));
  return pts;
}

function exerciseCounts(workouts) {
  const m = new Map();
  workouts.forEach(w => (w.entries || []).forEach(e => {
    if (e.kind !== 'strength' || !doneSets(e).length) return;
    const k = exKey(e.name), cur = m.get(k) || { name: e.name, count: 0 };
    cur.count++; m.set(k, cur);
  }));
  return [...m.values()].sort((a, b) => b.count - a.count);
}

function cardioSummary(workouts) {
  const m = new Map();
  workouts.forEach(w => (w.entries || []).forEach(e => {
    if (!cardioDone(e)) return;
    const k = e.activity || 'other', cur = m.get(k) || { activity: k, sessions: 0, minutes: 0, km: 0, points: [] };
    cur.sessions++; cur.minutes += e.minutes; cur.km += e.km || 0;
    cur.points.push({ date: w.date, minutes: e.minutes, km: e.km || 0, pace: e.km >= 1 ? paceOf(e.minutes, e.km) : null });
    m.set(k, cur);
  }));
  return [...m.values()].sort((a, b) => b.minutes - a.minutes);
}

/* ---------- Import from the old site ---------- */

function convertLegacy(oldPrograms, oldWorkouts) {
  const idMap = new Map();
  const programs = (oldPrograms || []).map(p => {
    const id = 'old-p-' + p.id; idMap.set(String(p.id), id);
    const days = (p.days || []).map(d => ({
      id: uid(), name: d.name || 'Day',
      items: (d.exercises || []).map(x => (x.type === 'cardio'
        ? { id: uid(), kind: 'cardio', activity: guessActivity(x.name), name: x.name, targetMin: x.targetMinutes || null, targetKm: x.targetKm || null, notes: x.notes || '' }
        : { id: uid(), kind: 'strength', name: x.name, sets: x.sets || 3, reps: String(x.reps || ''), restSec: 90, notes: x.notes || '' }))
    }));
    const kinds = new Set(days.flatMap(d => d.items.map(i => i.kind)));
    return {
      id, name: p.name || 'Imported program', description: p.description || '', days,
      type: kinds.size > 1 ? 'mixed' : kinds.has('cardio') ? 'cardio' : 'strength',
      status: p.status === 'archived' || p.status === 'inactive' ? 'archived' : 'active',
      daysPerWeek: days.length, createdAt: p.createdAt || new Date().toISOString(), imported: true
    };
  });
  const workouts = (oldWorkouts || []).map(w => ({
    id: 'old-' + w.id, imported: true, date: toDateStr(new Date(w.date)), startedAt: w.date,
    programId: idMap.get(String(w.programId)) || null, programName: w.programName || '', dayName: w.dayName || '', notes: '',
    entries: (w.exercises || []).map(x => (x.type === 'cardio'
      ? { kind: 'cardio', activity: guessActivity(x.name), name: x.name, minutes: num(x.minutesCompleted), km: num(x.kmCompleted), notes: '' }
      : { kind: 'strength', name: x.name, notes: '', sets: (x.sets || []).map(s => ({ kg: num(s.weight), reps: Math.round(num(s.reps)), done: true })) }))
  })).filter(w => w.entries.length && !isNaN(parseDate(w.date)));
  return { programs, workouts };
}

function guessActivity(name) {
  const n = String(name || '').toLowerCase();
  if (/surf/.test(n)) return 'surf';
  if (/run|jog|sprint|treadmill/.test(n)) return 'run';
  if (/bike|cycl|ride|spin/.test(n)) return 'bike';
  if (/swim/.test(n)) return 'swim';
  if (/row|erg/.test(n)) return 'row';
  if (/hike|trek/.test(n)) return 'hike';
  if (/walk/.test(n)) return 'walk';
  return 'other';
}

   Signed in: Firestore, one document per program and per workout under users/{uid}.
   Not signed in: this browser's localStorage, so the app can be tried without an account. */

const firebaseConfig = {
  apiKey: 'AIzaSyCJJJD1Q042zWQVXteOzxDzzrIfJ4Rl8d4',
  authDomain: 'marc-fitness-app.firebaseapp.com',
  projectId: 'marc-fitness-app',
  storageBucket: 'marc-fitness-app.firebasestorage.app',
  messagingSenderId: '576620452553',
  appId: '1:576620452553:web:e54ce7f684dbe5f58a8b18'
};

const LOCAL_KEY = 'tideline.local.v1';
const LOCAL_FLAG = 'tideline.useLocal';
const clean = o => JSON.parse(JSON.stringify(o));
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } };

const Store = {
  mode: null, user: null, auth: null, db: null, available: false, onError: () => {},

  init(onAuth) {
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        this.auth = firebase.auth();
        this.db = firebase.firestore();
        this.db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
        this.available = true;
      }
    } catch (e) { this.available = false; }

    if (!this.available) { this._local(onAuth, lsGet(LOCAL_FLAG)); return; }
    this.auth.onAuthStateChanged(user => {
      if (user) { this.mode = 'cloud'; this.user = { uid: user.uid, name: user.displayName || '', email: user.email || '' }; onAuth(this.user); }
      else this._local(onAuth, lsGet(LOCAL_FLAG));
    });
  },

  _local(onAuth, enabled) {
    if (enabled) { this.mode = 'local'; this.user = { uid: 'local', name: '', email: '' }; onAuth(this.user); }
    else { this.mode = null; this.user = null; onAuth(null); }
  },

  async signIn() {
    const provider = new firebase.auth.GoogleAuthProvider();
    try { await this.auth.signInWithPopup(provider); }
    catch (e) {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) return this.auth.signInWithRedirect(provider);
      if (e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request')) return;
      throw e;
    }
  },

  startLocal(onAuth) { lsSet(LOCAL_FLAG, true); this._local(onAuth, true); },

  async signOut(onAuth) {
    if (this.mode === 'cloud') return this.auth.signOut();
    lsDel(LOCAL_FLAG); this._local(onAuth, false);
  },

  _userDoc() { return this.db.collection('users').doc(this.user.uid); },
  _localData() { return lsGet(LOCAL_KEY) || { profile: null, programs: [], workouts: [] }; },
  _localWrite(fn) { const d = this._localData(); fn(d); if (!lsSet(LOCAL_KEY, d)) this.onError(new Error('This browser would not save the change.')); },
  _guard(promise) { promise.catch(e => this.onError(e)); },

  async load() {
    if (this.mode === 'local') return { ...this._localData(), legacy: null };
    const ref = this._userDoc();
    const [doc, progs, works] = await Promise.all([ref.get(), ref.collection('programs').get(), ref.collection('workouts').get()]);
    const data = doc.exists ? doc.data() : {};
    // The previous version of the site kept everything in two arrays on the user document.
    const hasOld = (Array.isArray(data.workouts) && data.workouts.length) || (Array.isArray(data.programs) && data.programs.length);
    return {
      profile: data.fitnessProfile || null,
      programs: progs.docs.map(d => d.data()),
      workouts: works.docs.map(d => d.data()),
      legacy: hasOld ? { programs: data.programs || [], workouts: data.workouts || [] } : null
    };
  },

  saveProfile(profile) {
    if (this.mode === 'local') return this._localWrite(d => { d.profile = clean(profile); });
    this._guard(this._userDoc().set({ fitnessProfile: clean(profile) }, { merge: true }));
  },

  _put(kind, item) {
    if (this.mode === 'local') return this._localWrite(d => { d[kind] = d[kind].filter(x => x.id !== item.id).concat([clean(item)]); });
    this._guard(this._userDoc().collection(kind).doc(String(item.id)).set(clean(item)));
  },
  _remove(kind, id) {
    if (this.mode === 'local') return this._localWrite(d => { d[kind] = d[kind].filter(x => x.id !== id); });
    this._guard(this._userDoc().collection(kind).doc(String(id)).delete());
  },
  saveProgram(p) { this._put('programs', p); },
  deleteProgram(id) { this._remove('programs', id); },
  saveWorkout(w) { this._put('workouts', w); },
  deleteWorkout(id) { this._remove('workouts', id); },

  /* Writes many documents at once (import). Firestore allows 500 writes per batch. */
  async saveMany(programs, workouts) {
    if (this.mode === 'local') return this._localWrite(d => {
      const ids = new Set([...programs, ...workouts].map(x => x.id));
      d.programs = d.programs.filter(x => !ids.has(x.id)).concat(clean(programs));
      d.workouts = d.workouts.filter(x => !ids.has(x.id)).concat(clean(workouts));
    });
    const ref = this._userDoc();
    const ops = [...programs.map(p => ['programs', p]), ...workouts.map(w => ['workouts', w])];
    for (let i = 0; i < ops.length; i += 400) {
      const batch = this.db.batch();
      ops.slice(i, i + 400).forEach(([kind, item]) => batch.set(ref.collection(kind).doc(String(item.id)), clean(item)));
      await batch.commit();
    }
  }
};

/* ---------- Charts: hand-drawn SVG, sized to the container ---------- */

const escAttr = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function niceMax(v) {
  if (v <= 0) return 1;
  const p = 10 ** Math.floor(Math.log10(v)), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 4 ? 4 : n <= 5 ? 5 : n <= 8 ? 8 : 10) * p;
}

function gridLines(M, w, h, max, min, fmt, steps = 3) {
  let out = '';
  for (let i = 0; i <= steps; i++) {
    const v = min + ((max - min) * i) / steps, y = h - M.b - ((h - M.t - M.b) * i) / steps;
    out += `<line class="grid${i === 0 ? ' base' : ''}" x1="${M.l}" x2="${w - M.r}" y1="${y}" y2="${y}"/>` +
      `<text class="tick" x="${M.l - 6}" y="${y + 3.5}" text-anchor="end">${fmt(v)}</text>`;
  }
  return out;
}

const topRound = (x, y, bw, bh, r) => {
  r = Math.min(r, bh, bw / 2);
  return `M${x},${y + bh}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${y + bh}Z`;
};

/* rows: [{label, tip, segs: [{v, cls}]}] — one or more stacked segments per bar. */
function barChart({ w, h = 190, rows, target, targetLabel, fmt = v => fmtBig(v) }) {
  const M = { l: 36, r: 8, t: 12, b: 24 }, pw = w - M.l - M.r, ph = h - M.t - M.b;
  const totals = rows.map(r => r.segs.reduce((a, s) => a + s.v, 0));
  const max = niceMax(Math.max(...totals, target || 0, 0.0001));
  const slot = pw / rows.length, bw = Math.max(3, Math.min(30, slot * 0.64));
  const every = Math.max(1, Math.ceil((rows.length * 44) / pw));
  let out = gridLines(M, w, h, max, 0, fmt, max <= 4 && Number.isInteger(max) ? max : 4);
  rows.forEach((r, i) => {
    const x = M.l + slot * i + (slot - bw) / 2;
    let y = h - M.b;
    const live = r.segs.filter(s => s.v > 0);
    live.forEach((s, j) => {
      const sh = Math.max(2, (s.v / max) * ph - (j > 0 ? 2 : 0));
      y -= sh + (j > 0 ? 2 : 0);
      out += j === live.length - 1 ? `<path class="${s.cls}" d="${topRound(x, y, bw, sh, 4)}"/>` : `<rect class="${s.cls}" x="${x}" y="${y}" width="${bw}" height="${sh}"/>`;
    });
    if ((rows.length - 1 - i) % every === 0) out += `<text class="tick" x="${x + bw / 2}" y="${h - 7}" text-anchor="middle">${escAttr(r.label)}</text>`;
    out += `<rect class="hit" x="${M.l + slot * i}" y="${M.t}" width="${slot}" height="${ph}" data-tip="${escAttr(r.tip)}"/>`;
  });
  if (target) {
    const ty = h - M.b - (target / max) * ph;
    out += `<line class="target" x1="${M.l}" x2="${w - M.r}" y1="${ty}" y2="${ty}"/>`;
    if (targetLabel) out += `<text class="tick target-label" x="${w - M.r}" y="${ty - 5}" text-anchor="end">${escAttr(targetLabel)}</text>`;
  }
  return `<svg width="${w}" height="${h}" role="img">${out}</svg>`;
}

/* pts: [{date, y, tip}] on a time axis. */
function lineChart({ w, h = 200, pts, fmt = v => String(round(v, 0)), cls = 's1', lastLabel }) {
  const M = { l: 44, r: 14, t: 14, b: 24 }, pw = w - M.l - M.r, ph = h - M.t - M.b;
  const ys = pts.map(p => p.y), lo = Math.min(...ys), hi = Math.max(...ys), padY = (hi - lo || hi * 0.1 || 1) * 0.18;
  const min = Math.max(0, lo - padY), max = hi + padY;
  const t0 = parseDate(pts[0].date).getTime(), t1 = parseDate(pts[pts.length - 1].date).getTime(), span = t1 - t0 || 1;
  const X = p => M.l + (pts.length === 1 ? pw / 2 : ((parseDate(p.date).getTime() - t0) / span) * pw);
  const Y = p => h - M.b - ((p.y - min) / (max - min)) * ph;
  let out = gridLines(M, w, h, max, min, fmt, 3);
  out += `<text class="tick" x="${M.l}" y="${h - 7}">${fmtDate(pts[0].date)}</text>`;
  if (pts.length > 1) out += `<text class="tick" x="${w - M.r}" y="${h - 7}" text-anchor="end">${fmtDate(pts[pts.length - 1].date)}</text>`;
  if (pts.length > 1) out += `<path class="line ${cls}" d="${pts.map((p, i) => `${i ? 'L' : 'M'}${X(p).toFixed(1)},${Y(p).toFixed(1)}`).join('')}"/>`;
  pts.forEach((p, i) => {
    const x = X(p), left = i ? (x + X(pts[i - 1])) / 2 : M.l, right = i < pts.length - 1 ? (x + X(pts[i + 1])) / 2 : w - M.r;
    out += `<g class="pt"><line class="guide" x1="${x}" x2="${x}" y1="${M.t}" y2="${h - M.b}"/>` +
      `<circle class="dot ${cls}${pts.length > 40 && i < pts.length - 1 ? ' quiet' : ''}" cx="${x}" cy="${Y(p)}" r="4"/>` +
      `<rect class="hit" x="${left}" y="${M.t}" width="${Math.max(8, right - left)}" height="${ph}" data-tip="${escAttr(p.tip)}"/></g>`;
  });
  if (lastLabel) {
    const p = pts[pts.length - 1];
    out += `<text class="direct" x="${X(p) - 8}" y="${Math.max(M.t + 10, Y(p) - 10)}" text-anchor="end">${escAttr(lastLabel)}</text>`;
  }
  return `<svg width="${w}" height="${h}" role="img">${out}</svg>`;
}

/* A calendar of the last N weeks. minutesByDate: Map(date -> minutes). */
function heatmap({ w, minutesByDate, weeks = 26 }) {
  const left = 30, top = 18, gap = 3;
  weeks = Math.min(weeks, Math.max(8, Math.floor((w - left) / 13)));
  const cell = Math.min(18, Math.floor((w - left) / weeks) - gap);
  const start = addDays(weekStart(todayStr()), -7 * (weeks - 1)), today = todayStr();
  let out = '', lastMonth = -1;
  [0, 2, 4, 6].forEach(r => { out += `<text class="tick" x="0" y="${top + r * (cell + gap) + cell - 3}">${WEEKDAYS[r]}</text>`; });
  for (let c = 0; c < weeks; c++) {
    const ws = addDays(start, c * 7), m = parseDate(ws).getMonth();
    if (m !== lastMonth && c < weeks - 1) { out += `<text class="tick" x="${left + c * (cell + gap)}" y="10">${MONTHS[m]}</text>`; lastMonth = m; }
    for (let r = 0; r < 7; r++) {
      const d = addDays(ws, r); if (d > today) continue;
      const min = minutesByDate.get(d) || 0, lvl = min === 0 ? 0 : min <= 30 ? 1 : min <= 60 ? 2 : min <= 90 ? 3 : 4;
      out += `<rect class="cell l${lvl}${d === today ? ' today' : ''}" x="${left + c * (cell + gap)}" y="${top + r * (cell + gap)}" width="${cell}" height="${cell}" rx="3" data-tip="${escAttr(`${WEEKDAYS[r]} ${fmtDate(d)}: ${min ? fmtDur(min) : 'rest day'}`)}"/>`;
    }
  }
  return `<svg width="${left + weeks * (cell + gap)}" height="${top + 7 * (cell + gap)}" role="img">${out}</svg>`;
}

const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const val = v => (v || v === 0 ? esc(v) : '');

const ICONS = {
  today: '<path d="M3 12c3-5 6-5 9 0s6 5 9 0"/><path d="M3 18c3-5 6-5 9 0s6 5 9 0" opacity=".45"/>',

const itemSummary = it => {
  if (it.kind === 'cardio') {
    const bits = [it.targetMin ? fmtDur(it.targetMin) : '', it.targetKm ? fmtD(it.targetKm) : ''].filter(Boolean).join(', ');
    return bits || activityOf(it.activity).label;
  }
  if (it.kind === 'timed') return `${it.sets} × ${fmtSec(it.targetSec || 0)}`;
  return `${it.sets} × ${esc(it.reps || '?')}`;
};
const typeLabel = t => (PROGRAM_TYPES.find(x => x.id === t) || PROGRAM_TYPES[0]).label;

const OB_STEPS = ['About you', 'Your goal', 'Your week', 'Restrictions', 'Your program'];

function profileFields(bind, p) {

  return `

    <div class="field"><span>Sex</span>${choices(`${bind}.sex`, [{ id: 'male', label: 'Male' }, { id: 'female', label: 'Female' }, { id: 'other', label: 'Rather not say' }], p.sex, 'inline')}</div>
    <div class="row3">
      <label class="field"><span>Age</span><input type="number" inputmode="numeric" min="13" max="100" data-bind="${bind}.age" data-as="int" value="${val(p.age)}"></label>

function planFields(bind, p) {
  return `

function restrictionFields(bind, p) {

function fitCard(t, fit, best) {
  return `<article class="card prog${best ? ' best' : ''}">
    <div class="prog-head">
      <div><h3>${esc(t.name)}</h3><p class="meta">${typeLabel(t.type)}, ${plural(t.daysPerWeek, 'day')} a week</p></div>
      ${best ? '<span class="tag brand">Best fit</span>' : ''}
    </div>
    <p>${esc(t.description)}</p>
    <ul class="fit">
      ${fit.reasons.map(r => `<li class="yes">${esc(r)}</li>`).join('')}
      ${fit.warnings.map(r => `<li class="warn">${esc(r)}</li>`).join('')}
      ${fit.cautions.map(c => `<li class="warn">Loads your ${esc(c.label.toLowerCase())}: ${esc(c.exercises.slice(0, 3).join(', '))}. Swap or go lighter.</li>`).join('')}

    <div class="actions">
      <button class="btn ${best ? 'primary' : ''}" data-act="useTemplate" data-id="${t.templateId}">Start this program</button>

const daysPreview = days => `<div class="days-preview">${days.map(d => `<div><h4>${esc(d.name)}</h4><ul class="plain">${d.items.map(it =>
  `<li><span>${esc(it.name)}</span><span class="meta">${itemSummary(it)}</span></li>`).join('')}</ul></div>`).join('')}</div>`;

function viewOnboarding() {
  const { step, data } = state.ob;
  let body = '';
  if (step === 0) body = `<h1>First, a little about you</h1><p class="lede">This sets your units and helps suggest a program that fits.</p>${profileFields('ob.data', data)}`;
  if (step === 1) body = `<h1>What are you training for?</h1><p class="lede">Pick the one that matters most right now. You can change it later.</p>${choices('ob.data.goal', GOALS, data.goal)}`;
  if (step === 2) body = `<h1>What does your week look like?</h1>${planFields('ob.data', data)}`;
  if (step === 3) body = `<h1>Anything to work around?</h1><p class="lede">Select any areas that need care. Programs that load them will be flagged. Leave it empty if nothing applies.</p>${restrictionFields('ob.data', data)}`;
  if (step === 4) {
    const ranked = rankedTemplates(data);
    body = `<h1>Programs that fit you</h1><p class="lede">Ranked for your goal, experience, schedule and equipment. Every program can be edited after you start it.</p>
      ${ranked.slice(0, 3).map((r, i) => fitCard(r.t, r.fit, i === 0)).join('')}

  }
  return `<div class="ob">
    <header class="ob-head"><p class="brand">${APP_NAME}</p>
      <ol class="steps" aria-label="Setup progress">${OB_STEPS.map((s, i) => `<li class="${i < step ? 'done' : i === step ? 'now' : ''}"${i === step ? ' aria-current="step"' : ''}><span>${s}</span></li>`).join('')}</ol>
    </header>
    <section class="ob-body">${body}</section>
    ${step < 4 ? `<footer class="ob-foot">${step > 0 ? '<button class="btn ghost" data-act="obBack">Back</button>' : '<span></span>'}<button class="btn primary" data-act="obNext">Continue</button></footer>`
      : `<footer class="ob-foot"><button class="btn ghost" data-act="obBack">Back</button><span></span></footer>`}
  </div>`;
}

/* ---------- Today ---------- */

function weekStrip() {
  const start = weekStart(todayStr()), today = todayStr();
  const mins = WEEKDAYS.map((_, i) => state.workouts.filter(w => w.date === addDays(start, i)).reduce((a, w) => a + workoutMinutes(w).total, 0));
  const max = Math.max(60, ...mins), done = mins.filter(m => m > 0).length, target = state.profile.daysPerWeek || 3;
  const streak = targetStreak(state.workouts, target);
  return `<section class="week" aria-label="This week">
    <div class="week-bars">${WEEKDAYS.map((d, i) => {
      const date = addDays(start, i), cls = date === today ? ' today' : date > today ? ' future' : '';
      return `<div class="wd${cls}${mins[i] ? ' on' : ''}" title="${d}: ${mins[i] ? fmtDur(mins[i]) : 'no workout'}"><div class="wd-bar"><i style="height:${mins[i] ? Math.max(14, (mins[i] / max) * 100) : 0}%"></i></div><span>${d}</span></div>`;
    }).join('')}</div>
    <p class="week-sum"><strong>${done} of ${target}</strong> workouts this week${streak > 1 ? `<span class="tag">${streak} weeks on target</span>` : ''}</p>
  </section>`;
}

function activeProgram() {
  const active = state.programs.filter(p => p.status !== 'archived');
  return active.find(p => p.id === state.profile.activeProgramId) || active[0] || null;
}

function nextDayIndex(p) {
  const last = state.workouts.filter(w => w.programId === p.id).sort(byDate).pop();
  if (!last) return 0;
  const i = p.days.findIndex(d => d.id === last.dayId || d.name === last.dayName);
  return i < 0 ? 0 : (i + 1) % p.days.length;
}

function viewToday() {
  const d = new Date(), p = activeProgram(), name = state.profile.name;
  let main = '';
  if (state.draft) {
    main += `<section class="card accent"><h2>Workout in progress</h2><p>${esc(state.draft.dayName || 'Workout')}, started ${relDate(state.draft.date)}.</p>
      <div class="actions"><button class="btn primary" data-act="resume">Resume</button><button class="btn ghost" data-act="discardDraft">Discard</button></div></section>`;
  }
  if (p && p.days.length) {
    const next = nextDayIndex(p), pick = state.ui.pickDay != null && p.days[state.ui.pickDay] ? state.ui.pickDay : next, day = p.days[pick];
    main += `<section class="card">
      <p class="meta">${esc(p.name)}</p>
      <h2>${pick === next ? 'Next up: ' : ''}${esc(day.name)}</h2>
      ${p.days.length > 1 ? `<div class="chips" role="group" aria-label="Choose a day">${p.days.map((x, i) => `<button class="chip" data-act="pickDay" data-i="${i}" aria-pressed="${i === pick}">${esc(x.name)}</button>`).join('')}</div>` : ''}
      <ul class="plain">${day.items.map(it => `<li><span>${esc(it.name)}</span><span class="meta">${itemSummary(it)}</span></li>`).join('') || '<li class="meta">This day has no exercises yet.</li>'}</ul>
      ${state.draft ? '' : `<div class="actions"><button class="btn primary big" data-act="startDay" data-program="${p.id}" data-i="${pick}">Start workout</button></div>`}
    </section>`;
  } else {
    main += `<section class="card"><h2>You have no program yet</h2><p>Pick one that fits your goal, or build your own day by day.</p>
      <div class="actions"><a class="btn primary" href="#/programs">Choose a program</a><a class="btn" href="#/programs/new">Build my own</a></div></section>`;
  }
  if (!state.draft) {
    main += `<section class="card quiet"><h2>Log something else</h2>
      <div class="chips">${ACTIVITIES.slice(0, 7).map(a => `<button class="chip" data-act="quickCardio" data-v="${a.id}">${a.label}</button>`).join('')}<button class="chip" data-act="startEmpty">Empty workout</button></div></section>`;
  }
  if (state.legacy && !state.profile.legacyImportedAt) {
    main += `<section class="card quiet"><h2>Bring over your old log</h2><p>${plural(state.legacy.workouts.length, 'workout')} and ${plural(state.legacy.programs.length, 'program')} from the previous version of this site can be copied in. Nothing is removed from the old data.</p>
      <div class="actions"><button class="btn" data-act="importLegacy">Import them</button></div></section>`;
  }
  const { map } = records();
  const recent = [...state.workouts].sort(byDate).reverse().flatMap(w => (map.get(w.id) || []).map(pr => ({ ...pr, date: w.date, id: w.id }))).slice(0, 4);
  if (recent.length) main += `<section class="card quiet"><h2>Latest records</h2>${prList(recent, true)}</section>`;
  return `<header class="page-head"><p class="meta">${['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}</p><h1>${name ? `Hello, ${esc(name)}` : 'Today'}</h1></header>
    ${weekStrip()}${main}`;
}

const prList = (prs, withDate) => `<ul class="prs">${prs.map(pr => `<li><span class="medal" aria-hidden="true"></span><div><strong>${esc(pr.name)}</strong> <span class="pr-label">${esc(pr.label)}</span><p class="meta">${esc(pr.detail)}${withDate ? `, ${relDate(pr.date)}` : ''}</p></div></li>`).join('')}</ul>`;

      <label class="mini grow"><span>Note</span><input type="text" data-bind="${b}.notes" value="${val(it.notes)}" placeholder="optional"></label>
    </div>
  </li>`;
}

function viewBuilder() {

    <datalist id="exercise-names">${[...new Set([...EXERCISE_NAMES, ...exerciseCounts(state.workouts).map(x => x.name)])].map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div class="savebar"><a class="btn ghost" href="#/programs">Cancel</a><button class="btn primary" data-act="saveProgram">Save program</button></div>`;
