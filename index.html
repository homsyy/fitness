/* ---------- Logging a workout ---------- */

const prBadge = prs => (prs && prs.length ? `<span class="pr" title="${esc(prs.map(p => p.detail).join('; '))}"><span class="medal" aria-hidden="true"></span>${esc(prs[0].label)}</span>` : '');

function coachBlock(entry) {
  const d = state.draft, c = coachNotes(state.workouts, entry, d.date, d.editingId);
  return `<div class="coach${c.first ? ' first' : ''}">
    ${c.lines.map(l => `<p>${esc(l)}</p>`).join('')}
    ${c.tip ? `<p class="tip-line">${esc(c.tip)}</p>` : ''}
    ${c.lastNote ? `<p class="last-note">Your note last time: “${esc(c.lastNote)}”</p>` : ''}
  </div>`;
}

/* The part of an entry that changes while typing (pace, records). */
function cardioLive(i, prs) {
  const e = state.draft.entries[i], p = paceOf(e.minutes, e.km), mine = prs.filter(x => x.entryIndex === i);
  return `${p ? `<span class="pace">${fmtPace(p)}</span>` : ''}${mine.map(pr => prBadge([pr])).join('')}`;
}

function entryCard(e, i, prs) {
  const b = `draft.entries.${i}`, t = e.target || {};
  let target = '', body = '';
  if (e.kind === 'strength') {
    target = t.sets ? `${t.sets} sets of ${esc(t.reps || '?')}${t.restSec ? `, rest ${fmtSec(t.restSec)}` : ''}` : '';
    body = `<div class="sets" role="group" aria-label="Sets">
      <div class="set-head"><span>Set</span><span>${wUnit()}</span><span>Reps</span><span></span></div>
      ${e.sets.map((s, j) => `<div class="set${s.done ? ' done' : ''}">
        <span class="set-n">${j + 1}</span>
        <input type="number" inputmode="decimal" step="0.5" data-bind="${b}.sets.${j}.kg" data-as="w" value="${s.kg > 0 ? wOut(s.kg) : ''}" placeholder="0" aria-label="Set ${j + 1} weight">
        <input type="number" inputmode="numeric" data-bind="${b}.sets.${j}.reps" data-as="int" value="${s.reps > 0 ? s.reps : ''}" placeholder="${esc(t.reps || '')}" aria-label="Set ${j + 1} reps">
        <button class="tick-btn" data-act="toggleSet" data-e="${i}" data-s="${j}" aria-pressed="${!!s.done}" aria-label="Set ${j + 1} done">✓</button>
        ${prBadge(prs.filter(x => x.entryIndex === i && x.setIndex === j))}
      </div>`).join('')}
    </div>`;
  } else if (e.kind === 'timed') {
    target = t.sets ? `${t.sets} holds of ${fmtSec(t.targetSec || 0)}` : '';
    body = `<div class="sets timed" role="group" aria-label="Holds">
      <div class="set-head"><span>Set</span><span>Seconds</span><span></span></div>
      ${e.sets.map((s, j) => `<div class="set${s.done ? ' done' : ''}">
        <span class="set-n">${j + 1}</span>
        <input type="number" inputmode="numeric" data-bind="${b}.sets.${j}.sec" data-as="int" value="${s.sec > 0 ? s.sec : ''}" aria-label="Hold ${j + 1} seconds">
        <button class="tick-btn" data-act="toggleSet" data-e="${i}" data-s="${j}" aria-pressed="${!!s.done}" aria-label="Hold ${j + 1} done">✓</button>
        ${prBadge(prs.filter(x => x.entryIndex === i && x.setIndex === j))}
      </div>`).join('')}
    </div>`;
  } else {
    target = [t.targetMin ? fmtDur(t.targetMin) : '', t.targetKm ? fmtD(t.targetKm) : ''].filter(Boolean).join(', ');
    body = `<div class="cardio-in">
      <label class="mini"><span>Minutes</span><input type="number" inputmode="decimal" data-bind="${b}.minutes" data-as="num" data-live="${i}" value="${e.minutes > 0 ? e.minutes : ''}" placeholder="${val(t.targetMin)}"></label>
      <label class="mini"><span>Distance (${dUnit()})</span><input type="number" inputmode="decimal" step="0.01" data-bind="${b}.km" data-as="d" data-live="${i}" value="${e.km > 0 ? dOut(e.km) : ''}" placeholder="${t.targetKm ? dOut(t.targetKm) : 'optional'}"></label>
      <div class="live" id="live-${i}" aria-live="polite">${cardioLive(i, prs)}</div>
    </div>`;
  }
  return `<article class="card entry">
    <div class="entry-head">
      <div><h2>${esc(e.name)}</h2>${target ? `<p class="meta">Plan: ${target}${t.notes ? `. ${esc(t.notes)}` : ''}</p>` : (t.notes ? `<p class="meta">${esc(t.notes)}</p>` : '')}</div>
      <button class="icon-btn" data-act="removeEntry" data-e="${i}" aria-label="Remove ${esc(e.name)} from this workout">×</button>
    </div>
    ${coachBlock(e)}
    ${body}
    ${e.kind !== 'cardio' ? `<div class="set-tools"><button class="btn small" data-act="addSet" data-e="${i}">Add set</button>${e.sets.length > 1 ? `<button class="btn small ghost" data-act="removeSet" data-e="${i}">Remove last</button>` : ''}</div>` : ''}
    <label class="field note-field"><span>Notes</span><textarea rows="1" data-bind="${b}.notes" placeholder="How did it feel?">${val(e.notes)}</textarea></label>
  </article>`;
}

function viewSession() {
  const d = state.draft, prs = draftPRs(), add = state.ui.add || { kind: 'strength', name: '', activity: 'run' };
  const total = d.entries.reduce((a, e) => a + (e.kind === 'cardio' ? 1 : e.sets.length), 0);
  const done = d.entries.reduce((a, e) => a + (e.kind === 'cardio' ? (e.minutes > 0 ? 1 : 0) : e.sets.filter(s => s.done).length), 0);
  return `<div class="session">
    <header class="session-head">
      <button class="btn ghost small" data-act="leaveSession">Close</button>
      <div class="session-title"><strong>${esc(d.dayName || 'Workout')}</strong><span class="meta">${d.editingId ? 'Editing' : `<span id="elapsed">${elapsedText()}</span>`}, ${done} of ${total} done</span></div>
      <button class="btn primary small" data-act="finish">Finish</button>
    </header>
    <div class="progress" aria-hidden="true"><i style="width:${total ? (done / total) * 100 : 0}%"></i></div>
    <main class="session-body">
      ${prs.length ? `<p class="pr-banner"><span class="medal" aria-hidden="true"></span>${plural(prs.length, 'record')} so far today</p>` : ''}
      ${d.entries.map((e, i) => entryCard(e, i, prs)).join('') || '<p class="empty">Add your first exercise below.</p>'}
      <section class="card quiet">
        <h2>Add to this workout</h2>
        <div class="choices inline">${[['strength', 'Strength'], ['cardio', 'Cardio'], ['timed', 'Timed hold']].map(([k, l]) => `<button class="choice" data-act="set" data-bind="ui.add.kind" data-v="${k}" aria-pressed="${add.kind === k}"><span>${l}</span></button>`).join('')}</div>
        <div class="add-row">
          ${add.kind === 'cardio'
            ? `<select data-bind="ui.add.activity" aria-label="Activity">${ACTIVITIES.map(a => `<option value="${a.id}"${a.id === add.activity ? ' selected' : ''}>${a.label}</option>`).join('')}</select>`
            : `<input type="text" data-bind="ui.add.name" value="${val(add.name)}" list="exercise-names" placeholder="Exercise name" aria-label="Exercise name">`}
          <button class="btn" data-act="addEntry">Add</button>
        </div>
        <datalist id="exercise-names">${[...new Set([...exerciseCounts(state.workouts).map(x => x.name), ...EXERCISE_NAMES])].map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      </section>
      <section class="card quiet">
        <label class="field"><span>Workout notes</span><textarea rows="2" data-bind="draft.notes" placeholder="Sleep, energy, conditions, anything worth remembering">${val(d.notes)}</textarea></label>
        <div class="row3">
          <label class="field"><span>Date</span><input type="date" data-bind="draft.date" data-act-change="rerender" max="${todayStr()}" value="${d.date}"></label>
          <label class="field"><span>Duration (min)</span><input type="number" inputmode="numeric" data-bind="draft.durationOverride" data-as="int" value="${val(d.durationOverride)}" placeholder="${d.editingId || d.date !== todayStr() ? 'optional' : 'from timer'}"></label>
        </div>
        <div class="actions spread"><button class="btn ghost danger" data-act="discardDraft">${d.editingId ? 'Cancel editing' : 'Discard workout'}</button><button class="btn primary big" data-act="finish">${d.editingId ? 'Save changes' : 'Finish workout'}</button></div>
      </section>
    </main>
    <div id="rest" class="rest" hidden></div>
  </div>`;
}

/* ---------- History ---------- */

function workoutLine(w) {
  const m = workoutMinutes(w), vol = workoutVolume(w), km = workoutKm(w), sets = workoutSets(w);
  return [sets ? plural(sets, 'set') : '', vol ? `${fmtBig(wOut(vol))} ${wUnit()} lifted` : '', km ? fmtD(km) : '', m.total ? fmtDur(m.total) : ''].filter(Boolean).join(', ');
}
const workoutTitle = w => w.dayName || (w.entries.length === 1 ? w.entries[0].name : 'Workout');

function viewHistory() {
  const list = [...state.workouts].sort(byDate).reverse(), { map } = records();
  const shown = list.slice(0, state.ui.historyLimit || 40);
  let out = '', month = '';
  shown.forEach(w => {
    const d = parseDate(w.date), m = `${['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][d.getMonth()]} ${d.getFullYear()}`;
    if (m !== month) { out += `${month ? '</ul>' : ''}<h2 class="sec">${m}</h2><ul class="hist">`; month = m; }
    const n = (map.get(w.id) || []).length;
    out += `<li><a href="#/workout/${esc(w.id)}"><span class="hist-date"><b>${d.getDate()}</b>${WEEKDAYS[(d.getDay() + 6) % 7]}</span>
      <span class="hist-main"><strong>${esc(workoutTitle(w))}</strong><span class="meta">${esc(workoutLine(w))}</span></span>
      ${n ? `<span class="pr"><span class="medal" aria-hidden="true"></span>${n}</span>` : ''}</a></li>`;
  });
  return `<header class="page-head"><h1>History</h1></header>
    ${list.length ? out + '</ul>' : '<p class="empty">Your finished workouts will appear here. Start one from Today.</p>'}
    ${list.length > shown.length ? `<button class="btn block" data-act="moreHistory">Show earlier workouts</button>` : ''}`;
}

function viewWorkout(id) {
  const w = state.workouts.find(x => String(x.id) === String(id));
  if (!w) return `<header class="page-head"><a class="back" href="#/history">History</a><h1>Workout not found</h1></header>`;
  const prs = records().map.get(w.id) || [], fresh = state.ui.justSaved === w.id;
  return `<header class="page-head"><a class="back" href="#/history">History</a>
      <p class="meta">${fmtDate(w.date, true)}${w.programName ? `, ${esc(w.programName)}` : ''}</p><h1>${fresh ? 'Done. ' : ''}${esc(workoutTitle(w))}</h1><p class="meta">${esc(workoutLine(w))}</p></header>
    ${prs.length ? `<section class="card gold"><h2>${plural(prs.length, 'record')}</h2>${prList(prs)}</section>` : (fresh ? '<section class="card quiet"><p>Logged. No records this time, and that is normal: most sessions are about showing up.</p></section>' : '')}
    ${w.notes ? `<section class="card quiet"><p class="quote">${esc(w.notes)}</p></section>` : ''}
    ${w.entries.map((e, i) => `<section class="card"><h2>${esc(e.name)}</h2>
      ${e.kind === 'cardio'
        ? `<p class="big-line">${fmtDur(e.minutes)}${e.km > 0 ? `, ${fmtD(e.km)}` : ''}${paceOf(e.minutes, e.km) ? `<span class="meta"> at ${fmtPace(paceOf(e.minutes, e.km))}</span>` : ''} ${prs.filter(p => p.entryIndex === i).map(p => prBadge([p])).join('')}</p>`
        : `<ol class="set-list">${e.sets.map((s, j) => setDone(e, s) ? `<li><span>${e.kind === 'timed' ? fmtSec(s.sec) : (s.kg > 0 ? `${fmtW(s.kg)} × ${s.reps}` : `${s.reps} reps`)}</span>${prBadge(prs.filter(p => p.entryIndex === i && p.setIndex === j))}</li>` : '').join('')}</ol>`}
      ${e.notes ? `<p class="quote">${esc(e.notes)}</p>` : ''}</section>`).join('')}
    <div class="actions spread"><button class="btn ghost danger" data-act="deleteWorkout" data-id="${esc(w.id)}">Delete</button><button class="btn" data-act="editWorkout" data-id="${esc(w.id)}">Edit this workout</button></div>`;
}

/* ---------- Stats ---------- */

const RANGES = [{ id: '4w', label: '4 weeks', weeks: 4 }, { id: '12w', label: '12 weeks', weeks: 12 }, { id: '26w', label: '6 months', weeks: 26 }, { id: '52w', label: '1 year', weeks: 52 }, { id: 'all', label: 'All time', weeks: 0 }];

function statsScope() {
  const r = RANGES.find(x => x.id === state.ui.range) || RANGES[1];
  let weeks = r.weeks;
  if (!weeks) {
    const first = state.workouts.reduce((a, w) => (w.date < a ? w.date : a), todayStr());
    weeks = Math.max(4, Math.min(156, Math.round((parseDate(weekStart(todayStr())) - parseDate(weekStart(first))) / (7 * 864e5)) + 1));
  }
  const from = addDays(weekStart(todayStr()), -7 * (weeks - 1));
  return { r, weeks, from, workouts: state.workouts.filter(w => w.date >= from) };
}

function viewStats() {
  if (!state.workouts.length) return `<header class="page-head"><h1>Stats</h1></header><p class="empty">Log your first workout and your numbers will start building here.</p>`;
  const { r, weeks, workouts } = statsScope(), { map } = records();
  const mins = workouts.reduce((a, w) => a + workoutMinutes(w).total, 0), vol = workouts.reduce((a, w) => a + workoutVolume(w), 0), km = workouts.reduce((a, w) => a + workoutKm(w), 0);
  const prs = [...workouts].sort(byDate).reverse().flatMap(w => (map.get(w.id) || []).map(p => ({ ...p, date: w.date })));
  const target = state.profile.daysPerWeek || 3, streak = targetStreak(state.workouts, target);
  const lifts = exerciseCounts(workouts), cardio = cardioSummary(workouts);
  const ex = lifts.find(l => exKey(l.name) === exKey(state.ui.statEx)) || lifts[0];
  const act = cardio.find(c => c.activity === state.ui.statAct) || cardio[0];
  const bw = (state.profile.weights || []).length;
  const tile = (label, value, sub) => `<div class="tile"><span class="tile-l">${label}</span><span class="tile-v">${value}</span>${sub ? `<span class="tile-s">${sub}</span>` : ''}</div>`;
  const best = (state.workouts.length && lifts.length) ? lifts.slice(0, 8).map(l => {
    const pts = exerciseSeries(workouts, l.name), top = pts.reduce((a, p) => (p.value > a.value ? p : a), pts[0]);
    const delta = pts.length > 1 ? pts[pts.length - 1].value - pts[0].value : 0;
    return `<tr><th scope="row"><button class="link" data-act="set" data-bind="ui.statEx" data-v="${esc(l.name)}">${esc(l.name)}</button></th><td>${fmtSet(top.set)}</td><td>${top.bodyweight ? '' : fmtW(round(top.value, 1))}</td>
      <td class="${delta > 0 ? 'up' : ''}">${pts.length > 1 && !top.bodyweight ? `${delta >= 0 ? '+' : '−'}${wOut(Math.abs(round(delta, 1)))}` : ''}</td><td>${l.count}</td></tr>`;
  }).join('') : '';
  return `<header class="page-head"><h1>Stats</h1></header>
    <div class="chips range" role="group" aria-label="Time range">${RANGES.map(x => `<button class="chip" data-act="set" data-bind="ui.range" data-v="${x.id}" aria-pressed="${x.id === r.id}">${x.label}</button>`).join('')}</div>
    <div class="tiles">
      ${tile('Workouts', workouts.length, `${round(workouts.length / weeks, 1)} a week`)}
      ${tile('Time trained', fmtDur(mins))}
      ${vol ? tile('Weight lifted', `${fmtBig(wOut(vol))} <small>${wUnit()}</small>`) : ''}
      ${km ? tile('Distance', `${round(dOut(km), 1)} <small>${dUnit()}</small>`) : ''}
      ${tile('Records', prs.length)}
      ${tile('On target', plural(streak, 'week'), `target ${target} a week`)}
    </div>
    <div class="stat-grid">
      <section class="card chart-card"><h2>Workouts per week</h2><div class="chart" data-chart="weekly"></div></section>
      <section class="card chart-card"><h2>Minutes per week</h2>
        <p class="legend"><span><i class="sw s1"></i>Strength and holds</span><span><i class="sw s2"></i>Cardio</span></p>
        <div class="chart" data-chart="minutes"></div></section>
      <section class="card chart-card wide"><h2>Training days</h2><div class="chart scroll" data-chart="heat"></div>
        <p class="legend end"><span>Shorter</span><i class="sw l1"></i><i class="sw l2"></i><i class="sw l3"></i><i class="sw l4"></i><span>Longer</span></p></section>
      ${ex ? `<section class="card chart-card wide"><div class="row"><h2>Strength: ${esc(ex.name)}</h2>
          <select data-bind="ui.statEx" data-act-change="rerender" aria-label="Exercise">${lifts.map(l => `<option value="${esc(l.name)}"${l.name === ex.name ? ' selected' : ''}>${esc(l.name)}</option>`).join('')}</select></div>
        <p class="sec-note" id="ex-caption"></p><div class="chart" data-chart="exercise" data-name="${esc(ex.name)}"></div>
        <div class="table-wrap"><table><thead><tr><th scope="col">Exercise</th><th scope="col">Best set</th><th scope="col">Est. 1 rep</th><th scope="col">Change</th><th scope="col">Sessions</th></tr></thead><tbody>${best}</tbody></table></div></section>` : ''}
      ${act ? `<section class="card chart-card wide"><div class="row"><h2>Cardio</h2>
          <div class="chips">${cardio.map(c => `<button class="chip" data-act="set" data-bind="ui.statAct" data-v="${c.activity}" aria-pressed="${c.activity === act.activity}">${activityOf(c.activity).label}</button>`).join('')}</div></div>
        <div class="tiles inner">${tile('Sessions', act.sessions)}${tile('Time', fmtDur(act.minutes))}${act.km ? tile('Distance', `${round(dOut(act.km), 1)} <small>${dUnit()}</small>`) : ''}${act.km >= 1 ? tile('Average pace', fmtPace(act.minutes / act.km).replace(' /', ' <small>/') + '</small>') : ''}</div>
        <p class="sec-note" id="cardio-caption"></p><div class="chart" data-chart="cardio" data-activity="${act.activity}"></div></section>` : ''}
      ${bw > 1 ? `<section class="card chart-card"><h2>Body weight</h2><div class="chart" data-chart="bodyweight"></div></section>` : ''}
      <section class="card chart-card${bw > 1 ? '' : ' wide'}"><h2>Records in this period</h2>${prs.length ? prList(prs.slice(0, 8), true) : '<p class="meta">None yet in this period. Records appear once you beat an earlier session.</p>'}</section>
    </div>`;
}

/* Fills the chart placeholders once the page is in the DOM, using their real width. */
function drawCharts() {
  const nodes = document.querySelectorAll('[data-chart]');
  if (!nodes.length) return;
  const { weeks, workouts } = statsScope(), rows = weeklySeries(state.workouts, weeks), target = state.profile.daysPerWeek || 3;
  nodes.forEach(el => {
    const w = Math.max(260, el.clientWidth), kind = el.dataset.chart;
    if (kind === 'weekly') el.innerHTML = barChart({ w, rows: rows.map(r => ({ label: fmtDate(r.start), tip: `Week of ${fmtDate(r.start)}: ${plural(r.count, 'workout')}`, segs: [{ v: r.count, cls: r.count >= target ? 's1' : 's1 dim' }] })), target, targetLabel: `target ${target}`, fmt: v => String(Math.round(v)) });
    if (kind === 'minutes') el.innerHTML = barChart({ w, rows: rows.map(r => ({ label: fmtDate(r.start), tip: `Week of ${fmtDate(r.start)}: ${fmtDur(r.strength)} strength, ${fmtDur(r.cardio)} cardio`, segs: [{ v: r.strength, cls: 's1' }, { v: r.cardio, cls: 's2' }] })) });
    if (kind === 'heat') {
      const m = new Map(); state.workouts.forEach(x => m.set(x.date, (m.get(x.date) || 0) + workoutMinutes(x).total));
      el.innerHTML = heatmap({ w, minutesByDate: m, weeks: 26 });
    }
    if (kind === 'exercise') {
      const pts = exerciseSeries(workouts, el.dataset.name), cap = document.getElementById('ex-caption');
      if (!pts.length) return;
      const bwOnly = pts.every(p => p.bodyweight), first = pts[0], last = pts[pts.length - 1], d = last.value - first.value;
      cap.textContent = bwOnly ? 'Best reps in a set, per session.' : `Estimated one-rep max from your best set each session.${pts.length > 1 ? ` ${d >= 0 ? 'Up' : 'Down'} ${fmtW(Math.abs(round(d, 1)))} since ${fmtDate(first.date)}.` : ''}`;
      el.innerHTML = lineChart({ w, pts: pts.map(p => ({ date: p.date, y: bwOnly ? p.value : wOut(p.value), tip: `${fmtDate(p.date, true)}: ${fmtSet(p.set)}${bwOnly ? '' : `, about ${fmtW(round(p.value, 1))} for one`}` })), lastLabel: bwOnly ? `${last.value} reps` : fmtW(round(last.value, 1)) });
    }
    if (kind === 'cardio') {
      const c = cardioSummary(workouts).find(x => x.activity === el.dataset.activity), cap = document.getElementById('cardio-caption');
      if (!c) return;
      const paced = c.points.filter(p => p.pace).sort((a, b) => (a.date < b.date ? -1 : 1));
      if (paced.length >= 2) {
        cap.textContent = `Pace per session. Lower is faster.`;
        el.innerHTML = lineChart({ w, cls: 's2', pts: paced.map(p => ({ date: p.date, y: UNITS === 'imperial' ? p.pace / MI : p.pace, tip: `${fmtDate(p.date, true)}: ${fmtD(p.km)} in ${fmtDur(p.minutes)}, ${fmtPace(p.pace)}` })), fmt: v => `${Math.floor(v)}:${pad2(Math.round((v - Math.floor(v)) * 60) % 60)}`, lastLabel: fmtPace(paced[paced.length - 1].pace) });
      } else {
        cap.textContent = 'Minutes per week.';
        const per = weeklySeries(state.workouts.map(x => ({ ...x, durationMin: 0, entries: x.entries.filter(e => e.kind === 'cardio' && (e.activity || 'other') === c.activity) })).filter(x => x.entries.length), weeks);
        el.innerHTML = barChart({ w, rows: per.map(r2 => ({ label: fmtDate(r2.start), tip: `Week of ${fmtDate(r2.start)}: ${fmtDur(r2.cardio)}`, segs: [{ v: r2.cardio, cls: 's2' }] })) });
      }
    }
    if (kind === 'bodyweight') {
      const pts = [...state.profile.weights].sort((a, b) => (a.date < b.date ? -1 : 1));
      el.innerHTML = lineChart({ w, pts: pts.map(p => ({ date: p.date, y: wOut(p.kg), tip: `${fmtDate(p.date, true)}: ${fmtW(p.kg)}` })), fmt: v => String(round(v, 1)), lastLabel: fmtW(pts[pts.length - 1].kg) });
    }
  });
}

/* ---------- Profile ---------- */

function energyEstimate(p) {
  if (!(p.weightKg && p.heightCm && p.age)) return null;
  const s = p.sex === 'male' ? 5 : p.sex === 'female' ? -161 : -78;
  const bmr = 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age + s, d = p.daysPerWeek || 3;
  return Math.round((bmr * (d <= 1 ? 1.2 : d <= 3 ? 1.375 : d <= 5 ? 1.55 : 1.725)) / 50) * 50;
}

function viewProfile() {
  const p = state.profile, kcal = energyEstimate(p), ws = [...(p.weights || [])].sort((a, b) => (a.date < b.date ? 1 : -1));
  const hint = p.goal === 'fatloss' ? `To lose fat steadily, eat around ${Math.round((kcal * 0.85) / 50) * 50}.` : p.goal === 'muscle' ? `To build muscle, eat around ${Math.round((kcal * 1.08) / 50) * 50}.` : '';
  return `<header class="page-head"><h1>Profile</h1><p class="meta">${Store.mode === 'cloud' ? `Signed in as ${esc(Store.user.email)}` : 'Saved on this device only'}</p></header>
    <section class="card"><h2>About you</h2>${profileFields('profile', p)}</section>
    <section class="card"><h2>Body weight</h2>
      <div class="add-row"><input type="number" inputmode="decimal" step="0.1" id="bw-input" placeholder="Today's weight (${wUnit()})" aria-label="Today's weight"><button class="btn" data-act="logWeight">Log weight</button></div>
      ${ws.length ? `<ul class="plain">${ws.slice(0, 5).map(x => `<li><span>${fmtDate(x.date, true)}</span><span>${fmtW(x.kg)}</span></li>`).join('')}</ul>` : '<p class="meta">Log it now and then to see the trend in Stats.</p>'}
      ${kcal ? `<p class="note">Rough estimate: about ${kcal} kcal a day keeps your weight steady at your training level. ${hint} This is a formula, not advice.</p>` : ''}
    </section>
    <section class="card"><h2>Goal</h2>${choices('profile.goal', GOALS, p.goal)}</section>
    <section class="card"><h2>Your week</h2>${planFields('profile', p)}</section>
    <section class="card"><h2>Restrictions</h2>${restrictionFields('profile', p)}</section>
    <section class="card"><h2>Your data</h2>
      <div class="actions">
        <button class="btn" data-act="exportData">Download a backup</button>
        ${state.legacy ? `<button class="btn" data-act="importLegacy">${p.legacyImportedAt ? 'Re-import from the old site' : 'Import from the old site'}</button>` : ''}
        <button class="btn ghost" data-act="signOut">${Store.mode === 'cloud' ? 'Sign out' : 'Leave device mode'}</button>
      </div>
    </section>`;
}

  const d = state.draft; if (!d || !d.startedAt) return '';

/* ---------- Small UI services ---------- */

let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3600);
}

let confirmKey = null, confirmTimer;
/* Destructive actions need a second tap rather than a browser dialog. */
function confirmed(key, what) {
  if (confirmKey === key) { confirmKey = null; return true; }
  confirmKey = key; clearTimeout(confirmTimer); confirmTimer = setTimeout(() => { confirmKey = null; }, 4000);
  toast(`Tap again to ${what}.`); return false;
}

function setPath(obj, path, value) {
  const keys = path.split('.'); let o = obj;
  for (let i = 0; i < keys.length - 1; i++) { if (o[keys[i]] == null) o[keys[i]] = {}; o = o[keys[i]]; }
  o[keys[keys.length - 1]] = value;
}

function convert(el) {
  const v = el.value, as = el.dataset.as;
  if (as === 'int') { const n = parseInt(v, 10); return isFinite(n) ? n : null; }
  if (as === 'num') return num(v);
  if (as === 'w') return v === '' ? 0 : wIn(v);
  if (as === 'd') return v === '' ? 0 : dIn(v);
  if (as === 'h') return v === '' ? null : (UNITS === 'imperial' ? num(v) * 2.54 : num(v));
  return v;
}

let saveTimer;
const later = fn => { clearTimeout(saveTimer); saveTimer = setTimeout(fn, 500); };
const saveProfile = () => Store.saveProfile(state.profile);
const saveDraft = () => { if (state.draft) lsSet(draftKey(), state.draft); else lsDel(draftKey()); };

/* ---------- Building a workout draft ---------- */

function buildEntry(item, date) {
  const base = { itemId: item.id || null, kind: item.kind, name: item.name || activityOf(item.activity).label, notes: '',
    target: { sets: item.sets, reps: item.reps, restSec: item.restSec, targetMin: item.targetMin, targetKm: item.targetKm, targetSec: item.targetSec, notes: item.notes || '' } };
  if (item.kind === 'cardio') return { ...base, activity: item.activity || 'other', minutes: 0, km: 0 };
  const prev = previousSessions(state.workouts, base, date, null)[0], last = prev ? doneSets(prev.entry) : [];
  const n = item.sets || last.length || 3;
  const sets = Array.from({ length: n }, (_, i) => {
    const l = last[i] || last[last.length - 1];
    return item.kind === 'timed' ? { sec: l ? l.sec : item.targetSec || 30, done: false } : { kg: l ? l.kg : 0, reps: l ? l.reps : 0, done: false };
  });
  return { ...base, sets };
}

function startDraft(fields, items) {
  if (state.draft && !confirmed('replace-draft', 'replace the workout in progress')) return;
  const date = todayStr();
  state.draft = { id: uid(), date, startedAt: Date.now(), notes: '', durationOverride: null, programId: null, programName: '', dayId: null, dayName: '', ...fields, entries: items.map(it => buildEntry(it, date)) };
  state.sessionOpen = true; state.rest = null; saveDraft(); render(); window.scrollTo(0, 0);
}

function completeOnboarding() {
  const d = state.ob.data;
  state.profile = { ...d, restrictions: d.restrictions || [], onboardedAt: new Date().toISOString(), weights: d.weightKg ? [{ date: todayStr(), kg: d.weightKg }] : [] };
  state.ob = null; saveProfile();
}

function addProgram(p, makeActive) {
  state.programs = state.programs.filter(x => x.id !== p.id).concat([p]);
  Store.saveProgram(p);
  if (makeActive || !activeProgram() || !state.profile.activeProgramId) { state.profile.activeProgramId = p.id; saveProfile(); }
}

  removeEntry(ds) {

    const entry = buildEntry(item, d.date); entry.target = a.kind === 'strength' ? { restSec: 90 } : {};

  skipRest() { state.rest = null; tick(); },

  finish() {
    const d = state.draft;
    const entries = d.entries.map(e => {
      if (e.kind === 'cardio') return e.minutes > 0 ? { kind: 'cardio', activity: e.activity, name: e.name, minutes: e.minutes, km: e.km || 0, notes: e.notes || '' } : null;
      const sets = e.sets.filter(s => s.done && setDone(e, s)).map(s => (e.kind === 'timed' ? { sec: s.sec, done: true } : { kg: s.kg || 0, reps: s.reps, done: true }));
      return sets.length ? { kind: e.kind, name: e.name, notes: e.notes || '', sets } : null;

      entries: c.entries.map(e => ({ ...e, target: {}, sets: e.sets ? e.sets.map(s => ({ ...s, done: true })) : undefined })) };

/* ---------- Routing and rendering ---------- */

const go = path => { if (location.hash === `#/${path}`) render(); else location.hash = `#/${path}`; };
const routeParts = () => (location.hash.replace(/^#\/?/, '') || 'today').split('/');

function prepareBuilder(parts) {
  const key = parts.join('/');
  if (state.builder && state.builder.routeKey === key) return true;
  if (parts[1] === 'new') state.builder = { isNew: true, routeKey: key, id: uid(), name: '', description: '', type: 'strength', status: 'active', days: [{ id: uid(), name: 'Day 1', items: [] }] };
  else {
    const p = state.programs.find(x => x.id === parts[2]); if (!p) return false;
    state.builder = { ...clean(p), isNew: false, routeKey: key };
  }
  return true;
}

function render() {
  const root = $('#app'), y = window.scrollY, focusSel = focusSelector();
  let html;
  if (state.error) html = `<div class="auth"><div class="auth-in"><p class="brand">${APP_NAME}</p><h1>Your log could not be loaded</h1><p class="lede">${esc(state.error)}</p><div class="auth-actions"><button class="btn primary" data-act="retry">Try again</button><button class="btn ghost" data-act="signOut">Sign out</button></div></div></div>`;
  else if (!state.ready) html = `<div class="auth"><div class="auth-in"><p class="brand">${APP_NAME}</p><p class="lede">Loading your log…</p></div></div>`;
  else if (!state.user) html = viewAuth();
  else if (state.ob) html = viewOnboarding();
  else if (state.draft && state.sessionOpen) html = viewSession();
  else {
    const parts = routeParts(), r = parts[0];
    let inner;
    if (r === 'programs' && (parts[1] === 'new' || parts[1] === 'edit')) inner = prepareBuilder(parts) ? viewBuilder() : viewPrograms();
    else if (r === 'programs') inner = viewPrograms();
    else if (r === 'history') inner = viewHistory();
    else if (r === 'workout') inner = viewWorkout(decodeURIComponent(parts[1] || ''));
    else if (r === 'stats') inner = viewStats();
    else if (r === 'profile') inner = viewProfile();
    else inner = viewToday();
    html = viewShell(r === 'workout' ? 'history' : NAV.some(n => n[0] === r) ? r : 'today', inner);
  }
  root.innerHTML = html;
  drawCharts(); tick();
  window.scrollTo(0, y);
  if (focusSel) { const el = document.querySelector(focusSel); if (el) el.focus({ preventScroll: true }); }
}

/* Keeps keyboard focus on the same control across a re-render. */
function focusSelector() {
  const el = document.activeElement;
  if (!el || el === document.body || !el.dataset) return null;
  const attrs = Object.entries(el.dataset).map(([k, v]) => `[data-${k.replace(/[A-Z]/g, m => '-' + m.toLowerCase())}="${String(v).replace(/"/g, '\\"')}"]`).join('');
  return attrs ? el.tagName.toLowerCase() + attrs : null;
}

function tick() {
  const el = $('#elapsed'); if (el) el.textContent = elapsedText();
  const rest = $('#rest'); if (!rest) return;
  if (!state.rest) { rest.hidden = true; return; }
  const left = Math.ceil((state.rest.until - Date.now()) / 1000);
  if (left <= -4) { state.rest = null; rest.hidden = true; return; }
  if (left <= 0 && !state.rest.buzzed) { state.rest.buzzed = true; if (navigator.vibrate) navigator.vibrate(200); }
  rest.hidden = false;
  rest.innerHTML = left > 0
    ? `<span>Rest</span><strong>${Math.floor(left / 60)}:${pad2(left % 60)}</strong><i style="width:${(left / state.rest.total) * 100}%"></i><button class="btn small ghost" data-act="skipRest">Skip</button>`
    : `<strong>Rest over. Next set.</strong>`;
}

async function onAuth(user) {
  state.user = user; state.error = null;
  if (!user) { state.ready = true; state.profile = null; state.ob = null; state.draft = null; return render(); }
  try {
    const data = await Store.load();
    state.profile = data.profile; state.programs = data.programs || []; state.workouts = data.workouts || []; state.legacy = data.legacy; touch();
    if (state.profile && state.profile.onboardedAt) { setUnits(state.profile.units); state.ob = null; }
    else { setUnits('metric'); state.ob = { step: 0, data: { name: (user.name || '').split(' ')[0], units: 'metric', daysPerWeek: 3, equipment: 'gym', restrictions: [] } }; }
    state.draft = lsGet(draftKey()); state.sessionOpen = false;
  } catch (e) {
    state.error = e && e.code === 'permission-denied'
      ? 'The database refused access. The Firestore security rules for this project need the rules that ship with this app (firestore.rules).'
      : `Something went wrong while loading: ${e && e.message ? e.message : e}`;
  }
  state.ready = true; render();
}

/* ---------- Events ---------- */

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = actions[el.dataset.act]; if (fn) { ev.preventDefault(); fn(el.dataset, el); }
});

document.addEventListener('input', ev => {
  const el = ev.target, bind = el.dataset && el.dataset.bind; if (!bind || el.dataset.act) return;
  setPath(state, bind, convert(el));
  if (bind.startsWith('profile.')) later(saveProfile);
  if (bind.startsWith('draft.')) {
    later(saveDraft);
    if (el.dataset.live != null) { const box = document.getElementById(`live-${el.dataset.live}`); if (box) box.innerHTML = cardioLive(+el.dataset.live, draftPRs()); }
  }
});
document.addEventListener('change', ev => { if (ev.target.dataset && ev.target.dataset.actChange === 'rerender') render(); });

const tipEl = () => $('#tip');
document.addEventListener('pointerover', ev => {
  const el = ev.target.closest && ev.target.closest('[data-tip]'), tip = tipEl();
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth;
  tip.style.left = `${Math.max(8, Math.min(window.innerWidth - tw - 8, r.left + r.width / 2 - tw / 2))}px`;
  tip.style.top = `${Math.max(8, r.top - tip.offsetHeight - 8) + window.scrollY}px`;
});
window.addEventListener('scroll', () => { tipEl().hidden = true; }, { passive: true });

let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCharts, 150); });
window.addEventListener('hashchange', () => { state.ui.open = null; if (!location.hash.startsWith('#/workout')) state.ui.justSaved = null; render(); window.scrollTo(0, 0); });
setInterval(tick, 500);

Store.onError = e => toast(`A change could not be saved: ${e && e.message ? e.message : e}`);
render();
Store.init(onAuth);

})();
</script>
</body>
</html>
